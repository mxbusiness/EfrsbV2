services:
  postgres:
    image: postgres:16
    container_name: efrsb-postgres
    environment:
      POSTGRES_DB: efrsb_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: